services:
  database:
    image: postgres:16-alpine
    container_name: cnss-postgres
    environment:
      POSTGRES_DB: cnss
      POSTGRES_USER: cnss
      POSTGRES_PASSWORD: cnss
    ports:
      - "5432:5432"
    volumes:
      - cnss-postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cnss-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cnss
      RABBITMQ_DEFAULT_PASS: cnss
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - cnss-rabbitmq-data:/var/lib/rabbitmq

volumes:
  cnss-postgres-data:
  cnss-rabbitmq-data:
